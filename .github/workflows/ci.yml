name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Every action is pinned to a full commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The database tests need a real MongoDB. A single-node replica set, because
      # transactions need one; the image is the digest deploy/compose.dev.yml pins
      # (mongo:8.0). Every wait is bounded and the step fails with the container log.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 \
            docker.io/library/mongo@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7 \
            --replSet rs0 --bind_ip_all
          mongosh() { docker exec mongo mongosh --quiet --eval "$1"; }
          fail() { echo "$1"; docker logs mongo; exit 1; }
          up=""
          for _ in $(seq 1 60); do
            if mongosh 'db.adminCommand({ping: 1}).ok' >/dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          [ -n "$up" ] || fail "mongod did not answer ping"
          mongosh "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok" >/dev/null || fail "rs.initiate failed"
          primary=""
          for _ in $(seq 1 60); do
            if mongosh 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then primary=1; break; fi
            sleep 1
          done
          [ -n "$primary" ] || fail "no writable primary"

      - name: go test
        env:
          MONGO_TEST_URI: mongodb://localhost:27017/?directConnection=true
        # The database packages can pass Go's default 10-minute test timeout under -race.
        # -p 2: at most two test binaries at once, so the race-instrumented tests do not
        # starve the MongoDB container of CPU (a test once waited past the driver's
        # 10-second server selection and failed with "cannot reach the MongoDB server").
        run: go test -race -count=1 -p 2 -timeout 30m ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build only: nothing is pushed. Production builds on its own host.
      - name: Build the image
        run: docker build --platform linux/amd64 -f deploy/Containerfile -t agenda:ci .
